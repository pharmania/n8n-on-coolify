version: "3.8"

services:
  n8n:
    image: n8nio/n8n:1.100.1
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - N8N_HOST=atm.pharmania.fr
      - N8N_PORT=5678
      - WEBHOOK_URL=https://atm.pharmania.fr/
      # --- TLS Postgres Supabase ---
      - NODE_EXTRA_CA_CERTS=/certs/supabase-ca.crt     # utilise le CA monté
      - SUPABASE_CA_B64=${SUPABASE_CA_B64}             # pris depuis Secrets
      # (optionnel) DNS: préfère IPv4
      - NODE_OPTIONS=--dns-result-order=ipv4first

    volumes:
      - n8n_data:/home/node/.n8n
      - n8n_certs:/certs                               # volume persistant pour le CA

    # ⚠️ override l’entrypoint pour exécuter un shell, puis lancer n8n
    entrypoint: ["/bin/sh","-lc"]
    command: >
      mkdir -p /certs &&
      node -e "require('fs').writeFileSync('/certs/supabase-ca.crt', Buffer.from(process.env.SUPABASE_CA_B64,'base64'))" &&
      exec n8n start

    labels:
      - "coolify.domain=atm.pharmania.fr"
      - "coolify.ssl=true"

volumes:
  n8n_data:
  n8n_certs:
